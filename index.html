<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Shwetha</title>
<style>
  :root{
    --kraft:#c9a876; --kraft-dark:#a98a5f; --paper:#fdf8ec; --ink:#3a2c22;
    --accent:#8a1f2d; --gold:#e0a634;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    min-height:100%;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.08), transparent 60%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0 2px, transparent 2px 6px),
      linear-gradient(180deg, var(--kraft), var(--kraft-dark));
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    display:flex; flex-direction:column; align-items:center;
    overflow-x:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #topspace{ height:8vh; min-height:36px; flex-shrink:0; }
  #stage{
    width:100%;
    display:flex; justify-content:center; align-items:flex-start;
    perspective: 2400px;
    padding: 0 12px 40px;
  }

  /* ---------- COVER ---------- */
  #cover-view{
    cursor:pointer;
    width:min(86vw, 360px);
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.35));
    transition: transform .35s ease;
  }
  #cover-view:active{ transform: scale(0.98); }
  #cover-view img{ width:100%; display:block; border-radius:4px; }
  #cover-hint{
    text-align:center; color:#f4e9d8; font-size:0.85rem; margin-top:14px;
    opacity:0.85; letter-spacing:0.04em; font-style:italic;
  }

  /* ---------- SPREAD ---------- */
  #spread-view{ display:none; width:100%; justify-content:center; flex-direction:column; align-items:center; }
  #book{
    display:flex; width:min(94vw, 920px);
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
  }
  .page{
    position:relative; width:50%; aspect-ratio: 700/906; overflow:hidden;
    background:#fff;
  }
  .page.left{ border-radius:6px 0 0 6px; box-shadow: inset -8px 0 18px -10px rgba(0,0,0,0.4); }
  .page.right{ border-radius:0 6px 6px 0; box-shadow: inset 8px 0 18px -10px rgba(0,0,0,0.35); }
  .page img.pagebg{ width:100%; height:100%; object-fit:cover; display:block; }

  .pageArrow{ display:none; }
  #pageDots{ display:none; }

  /* ---------- MOBILE: one page at a time, swipeable ---------- */
  @media (max-width: 700px){
    #book{
      position:relative; width:88vw; max-width:420px;
      aspect-ratio:700/906; touch-action: pan-y;
    }
    .page{
      position:absolute; inset:0; width:100%; height:100%;
      border-radius:8px !important; box-shadow:none !important;
      transition: transform .45s cubic-bezier(.3,.7,.3,1);
    }
    .page.left{ transform: translateX(0); z-index:2; }
    .page.right{ transform: translateX(101%); z-index:1; }
    #book.show-right .page.left{ transform: translateX(-101%); z-index:1; }
    #book.show-right .page.right{ transform: translateX(0); z-index:2; }
    .pageArrow{
      display:flex; align-items:center; justify-content:center;
      position:absolute; top:50%; transform:translateY(-50%);
      width:38px; height:38px; border-radius:50%; z-index:7;
      background:rgba(255,255,255,0.85); color:var(--accent);
      font-size:1.1rem; box-shadow:0 3px 8px rgba(0,0,0,0.3); cursor:pointer;
    }
    #arrowNext{ right:8px; }
    #arrowPrev{ left:8px; }
    #pageDots{
      display:flex; gap:6px; justify-content:center; margin-top:12px;
    }
    #pageDots span{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.4); }
    #pageDots span.active{ background:#fff; }
    #swipeHint{ display:block; color:#f4e9d8; font-size:0.68rem; opacity:0.75; margin-top:6px; text-align:center; }
  }
  @media (min-width: 701px){
    #pageDots, #swipeHint{ display:none !important; }
  }
  #swipeHint{ display:none; }

  /* letter interaction */
  #envelopeImg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #letterWrap{
    position:absolute; left:8%; right:8%; top:6%; bottom:6%;
    cursor:pointer;
    opacity:0; transform: translateY(10%) scale(0.85);
    transition: transform .5s cubic-bezier(.2,.8,.25,1), box-shadow .5s ease, opacity .4s ease;
    border-radius:4px;
    z-index:2; pointer-events:none;
  }
  #letterWrap img{ width:100%; height:100%; object-fit:contain; display:block; border-radius:4px; background:#fdf8ec; }
  #letterWrap.open{
    opacity:1; pointer-events:auto;
    transform: translateY(0) scale(1.06);
    box-shadow: 0 20px 40px rgba(0,0,0,0.45);
    z-index:5;
  }
  #tapCatcher{ position:absolute; left:15%; right:15%; top:35%; bottom:15%; z-index:3; cursor:pointer; }
  #letterHint{
    position:absolute; bottom:3%; left:0; right:0; text-align:center;
    font-size:0.7rem; color:#7a5240; opacity:0.8; pointer-events:none; z-index:3;
  }

  /* close corner */
  #closeCorner{
    position:absolute; right:0; bottom:0; width:64px; height:64px; z-index:6;
    cursor:pointer;
  }

  /* candles page */
  #candlePage{ background:#fff; }
  #cakeImg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .flame{

    position:absolute; transform-origin: 50% 90%;
    pointer-events:none; filter: drop-shadow(0 2px 4px rgba(150,80,0,0.4));
    transition: opacity .25s ease;
  }
  .flame img{ width:100%; height:100%; display:block; }
  .flame.lit{ animation: flicker 1.6s infinite ease-in-out; }
  .flame.out{ opacity:0; }
  @keyframes flicker{
    0%,100%{ transform: rotate(-2deg) scale(1); }
    50%{ transform: rotate(2deg) scale(1.05); }
  }
  .flame.blowing{ animation: none !important; }

  #blowUI{
    position:absolute; left:0; right:0; bottom:4%; display:flex; flex-direction:column;
    align-items:center; gap:6px; z-index:4;
  }
  #meterBox{
    width:60%; max-width:220px; height:10px; background:rgba(0,0,0,0.15);
    border-radius:6px; overflow:hidden; border:1px solid rgba(0,0,0,0.25);
  }
  #meterFill{ height:100%; width:0%; background:linear-gradient(90deg,#e0a634,var(--accent)); transition: width .06s linear; }
  #micStatus{ font-size:0.68rem; color:#6b4a3a; text-align:center; }
  #blowBtn{
    font-family:inherit; font-size:0.78rem; padding:7px 16px; border-radius:20px;
    border:1px solid var(--accent); background:#fff2ee; color:var(--accent); cursor:pointer;
  }
  #blowBtn:active{ background:var(--accent); color:#fff; }

  #wishOverlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background: rgba(253,248,236,0.88); z-index:8; text-align:center; flex-direction:column; gap:14px;
    padding: 10%;
  }
  #wishOverlay.show{ display:flex; }
  #wishOverlay h2{ font-family: 'Brush Script MT', cursive, Georgia; color:var(--accent); font-size:1.5rem; margin:0; }
  #relightBtn{
    font-family:inherit; font-size:0.75rem; padding:6px 14px; border-radius:16px;
    border:1px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer;
  }
  canvas#confetti{ position:absolute; inset:0; z-index:9; pointer-events:none; }

  /* back view */
  #back-view{ display:none; width:100%; justify-content:center; }
  #backCard{
    width:min(86vw, 360px); cursor:pointer;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.35));
  }
  #backCard img{ width:100%; display:block; border-radius:4px; }

  #hostNote{
    color:#f4e9d8; font-size:0.7rem; text-align:center; max-width:500px; margin:18px auto 0;
    opacity:0.75; line-height:1.4; padding:0 16px 20px;
  }
</style>
</head>

<script>
(function(){
  const coverView = document.getElementById('cover-view');
  const spreadView = document.getElementById('spread-view');
  const backView = document.getElementById('back-view');
  const letterWrap = document.getElementById('letterWrap');
  const tapCatcher = document.getElementById('tapCatcher');
  const letterHint = document.getElementById('letterHint');
  const closeCorner = document.getElementById('closeCorner');
  const backCard = document.getElementById('backCard');

  const book = document.getElementById('book');
  const arrowNext = document.getElementById('arrowNext');
  const arrowPrev = document.getElementById('arrowPrev');
  const dots = document.querySelectorAll('#pageDots span');

  function goPage(which){
    book.classList.toggle('show-right', which==='right');
    dots.forEach(d=> d.classList.toggle('active', d.dataset.p===which));
  }

  function showCover(){ coverView.parentElement.style.display=''; coverView.style.display='block'; spreadView.style.display='none'; backView.style.display='none'; }
  function showSpread(){ coverView.style.display='none'; spreadView.style.display='flex'; backView.style.display='none'; goPage('left'); }
  function showBack(){ coverView.style.display='none'; spreadView.style.display='none'; backView.style.display='flex'; }

  showCover();

  coverView.addEventListener('click', showSpread);

  letterWrap.addEventListener('click', (e)=>{
    e.stopPropagation();
    letterWrap.classList.toggle('open');
    letterHint.style.display = letterWrap.classList.contains('open') ? 'none' : '';
  });
  tapCatcher.addEventListener('click', (e)=>{
    e.stopPropagation();
    letterWrap.classList.add('open');
    letterHint.style.display = 'none';
  });

  closeCorner.addEventListener('click', (e)=>{
    e.stopPropagation();
    showBack();
  });

  backCard.addEventListener('click', showCover);

  arrowNext.addEventListener('click', (e)=>{ e.stopPropagation(); goPage('right'); });
  arrowPrev.addEventListener('click', (e)=>{ e.stopPropagation(); goPage('left'); });

  let touchStartX=null, touchStartY=null;
  book.addEventListener('touchstart', (e)=>{
    if(e.target.closest('.open') || e.target.closest('#blowUI') || e.target.closest('#wishOverlay') || e.target.closest('.pageArrow')){ touchStartX=null; return; }
    touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
  }, {passive:true});
  book.addEventListener('touchend', (e)=>{
    if(touchStartX===null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)*1.4){
      goPage(dx < 0 ? 'right' : 'left');
    }
    touchStartX=null;
  }, {passive:true});

  /* ---------------- CANDLES / MIC BLOW LOGIC ---------------- */
  const flames = [document.getElementById('f1'), document.getElementById('f2'), document.getElementById('f3')];
  const meterFill = document.getElementById('meterFill');
  const micStatus = document.getElementById('micStatus');
  const blowBtn = document.getElementById('blowBtn');
  const wishOverlay = document.getElementById('wishOverlay');
  const relightBtn = document.getElementById('relightBtn');
  const confettiCanvas = document.getElementById('confetti');

  let audioCtx, analyser, dataArray, micStream, rafId;
  let blowLevel = 0;          // smoothed volume 0..1
  let blowingSince = null;    // timestamp when sustained blow started
  let allOut = false;
  let fallbackHolding = false;
  const BLOW_THRESHOLD = 0.18;
  const BLOW_DURATION = 500; // ms

  function relight(){
    allOut = false;
    flames.forEach(f=>{ f.classList.remove('out','blowing'); f.classList.add('lit'); f.style.transform=''; });
    wishOverlay.classList.remove('show');
    blowingSince = null;
  }
  relightBtn.addEventListener('click', relight);

  async function initMic(){
    if (audioCtx) return true;
    try{
      micStream = await navigator.mediaDevices.getUserMedia({audio:true});
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      dataArray = new Uint8Array(analyser.fftSize);
      src.connect(analyser);
      micStatus.textContent = 'listening… blow into the mic 🎤';
      loop();
      return true;
    }catch(err){
      micStatus.textContent = 'mic unavailable — use the button or spacebar below';
      return false;
    }
  }

  function getVolume(){
    analyser.getByteTimeDomainData(dataArray);
    let sum=0;
    for(let i=0;i<dataArray.length;i++){
      const v = (dataArray[i]-128)/128;
      sum += v*v;
    }
    return Math.sqrt(sum/dataArray.length); // RMS 0..~1
  }

  function loop(){
    if(analyser && !fallbackHolding){
      const vol = getVolume();
      blowLevel += (vol - blowLevel) * 0.35;
    }
    applyBlow(blowLevel);
    rafId = requestAnimationFrame(loop);
  }

  function applyBlow(level){
    meterFill.style.width = Math.min(100, level*260) + '%';
    if(allOut) return;
    const blowing = level > BLOW_THRESHOLD;
    const now = performance.now();
    if(blowing){
      if(!blowingSince) blowingSince = now;
      const angle = Math.min(35, level*90) * (Math.sin(now/40)>0?1:-1);
      flames.forEach(f=>{
        f.classList.add('blowing');
        f.style.transform = `rotate(${angle}deg) scale(${1-Math.min(level,0.5)*0.3})`;
      });
      if(now - blowingSince > BLOW_DURATION){
        extinguishAll();
      }
    } else {
      blowingSince = null;
      flames.forEach(f=>{ f.classList.remove('blowing'); f.style.transform=''; });
    }
  }

  function extinguishAll(){
    allOut = true;
    flames.forEach((f,i)=>{
      setTimeout(()=>{ f.classList.remove('lit','blowing'); f.classList.add('out'); }, i*90);
    });
    setTimeout(()=>{
      wishOverlay.classList.add('show');
      burstConfetti();
    }, 420);
  }

  // tap anywhere on candle page (once) enables mic
  document.getElementById('candlePage').addEventListener('click', function once(e){
    if(e.target===closeCorner) return;
    initMic();
  }, {once:true});

  // fallback: hold-to-blow button
  function startFallback(){ fallbackHolding = true; blowLevel = 0.4; }
  function endFallback(){ fallbackHolding = false; blowLevel = 0; }
  blowBtn.addEventListener('mousedown', startFallback);
  blowBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); startFallback(); }, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>blowBtn.addEventListener(ev, endFallback));

  document.addEventListener('keydown', (e)=>{ if(e.code==='Space'){ e.preventDefault(); startFallback(); } });
  document.addEventListener('keyup', (e)=>{ if(e.code==='Space'){ e.preventDefault(); endFallback(); } });

  if(!(rafId)){ rafId = requestAnimationFrame(loop); }

  /* ---------------- CONFETTI ---------------- */
  const ctx = confettiCanvas.getContext('2d');
  let confettiPieces = [];
  function resizeCanvas(){
    const rect = confettiCanvas.parentElement.getBoundingClientRect();
    confettiCanvas.width = rect.width; confettiCanvas.height = rect.height;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  const colors = ['#e0a634','#8a1f2d','#f4b6c2','#7fae6f','#5a7fb0'];
  function burstConfetti(){
    resizeCanvas();
    confettiPieces = [];
    for(let i=0;i<70;i++){
      confettiPieces.push({
        x: Math.random()*confettiCanvas.width,
        y: -10 - Math.random()*80,
        vx: (Math.random()-0.5)*2,
        vy: 2+Math.random()*3,
        size: 4+Math.random()*5,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*360,
        vr: (Math.random()-0.5)*10
      });
    }
    animateConfetti();
  }
  function animateConfetti(){
    ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    let active=false;
    confettiPieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(p.y < confettiCanvas.height+20) active=true;
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    });
    if(active) requestAnimationFrame(animateConfetti);
    else ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  }

})();
</script>
</body>
